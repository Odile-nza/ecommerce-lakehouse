name: Lakehouse Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "step_functions/**"
      - "glue_jobs/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to run"
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

permissions:
  contents: read

jobs:
  plan:
    name: terraform plan
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan')
    runs-on: ubuntu-latest
    # This account's credentials are short-lived STS session tokens that expire in
    # hours — a plan failing because the stored secret went stale shouldn't block
    # the PR, so a failure here is surfaced but doesn't fail the workflow run.
    continue-on-error: true
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      # State is local (no remote backend configured — see terraform/README.md
      # if you add one), so this plan runs against a fresh/empty state on
      # every invocation rather than the stack's real state.
      - name: terraform init
        run: terraform init

      - name: terraform plan
        run: terraform plan -input=false

  apply:
    name: terraform apply
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
    runs-on: ubuntu-latest
    # Requires a GitHub environment named "aws" (Settings → Environments) — add
    # required reviewers there for a human approval gate before this runs.
    environment: aws
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: terraform init
        run: terraform init

      - name: terraform apply
        run: terraform apply -input=false -auto-approve
